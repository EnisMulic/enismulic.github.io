name: CI

on:
  push:
    branches: [master]
  # Keep this as pull_request, not pull_request_target: the latter runs fork PRs with this repo's
  # secrets, so a malicious PR could read NOTION_API_TOKEN or NYT_COOKIE. PRs without the token build with empty
  # collections instead (see notionToken in src/content.config.ts).
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm install

      - run: npm run build
        env:
          # Read-only token for the secret page's Books, Vinyl and Letterboxd data in Notion
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          # NYT-S session cookie for the secret page's Connections streak
          NYT_COOKIE: ${{ secrets.NYT_COOKIE }}
          # Deploys must have the data; pull requests (no secrets for Dependabot or forks) build without it
          DATA_REQUIRED: ${{ github.ref == 'refs/heads/master' }}

      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
